# Your personal settings - overrides config.yaml, never committed to git.
# Only list what you want to change. Edit on the Pi with:  nano config.local.yaml
# then apply with:  sudo systemctl restart birdguard

notify:
  ntfy:
    enabled: false
    # Pick something long and random - anyone who knows it can read your alerts.
    topic: birdguard-change-this-to-something-random-12345

